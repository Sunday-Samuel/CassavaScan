name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CassavaScan-${{ github.ref_name }}.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/CassavaScan-${{ github.ref_name }}.apk
